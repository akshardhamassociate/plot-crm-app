name: Build APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Capacitor
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync
        run: npx cap sync android
      - name: App icon
        run: npx capacitor-assets generate --android
      - name: Add Firebase (google-services)
        run: |
          cp google-services.json android/app/google-services.json
          sed -i "/com.android.tools.build:gradle/a\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plot-crm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
